# NJStats 试用窗口全量归档（CI 侧运行，不依赖本地 Mac）
# 背景: 试用数据窗口限 3 天、10-15 00:08 到期后不可再得；本地 cron 依赖电脑
# 开机, 故窗口期核心收割搬上 GitHub Actions（服务端 24/7 运行）。
# 需要仓库 secret: NJSTATS_KEY（设置一次: Settings → Secrets → New repository secret）
name: NJStats Archive
on:
  schedule:
    # 已退役（2026-10-15）：试用 2026-10-15 00:08 到期，端点不再可写。
    # 保留文件作为「窗口期收割方案」记录；若未来重新订阅，把 cron 取消注释即可。
    # - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install deps
        run: pip install requests --quiet
      - name: Archive (budget 25/h, 与本地 20/h 共享 60/h 限额)
        env:
          NJSTATS_TOKEN: ${{ secrets.NJSTATS_KEY }}
          NJSTATS_ARCHIVE_PROGRESS: data/state/njstats_archive/.progress.json
        run: python scripts/njstats_archive.py --budget 25
      - name: Commit archive
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          # 2026-10-13 起 njstats_archive/ 已移出 git（原始可重抓数据，
          # 33MB+/轮，与 odds_sina.json 同政策）。本 job 只剩"取数并写盘"职责，
          # 不再提交——否则 `git add` 被 .gitignore 拒绝会 exit 1，
          # 整个 Archive job 失败（实测 2026-10-15T00:35Z 那次失败正是此因）。
          #
          # 数据落在 runner 工作区，下一轮 checkout 时丢弃。
          # 长期保存由本机/导出管线负责（scripts/njstats_export.py），
          # 试用到期后该端点也不可再得——归档使命随窗口期结束而终止。
          echo "归档已写盘（不入 git）；本 job 无提交职责"
